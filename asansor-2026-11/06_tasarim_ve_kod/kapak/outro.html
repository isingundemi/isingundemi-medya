<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:P;font-weight:600;src:url(poppins-latin-ext-600-normal.woff2),url(poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(poppins-latin-ext-700-normal.woff2),url(poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(poppins-latin-ext-800-normal.woff2),url(poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:600;unicode-range:U+0000-00FF;src:url(poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;unicode-range:U+0000-00FF;src:url(poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;unicode-range:U+0000-00FF;src:url(poppins-latin-800-normal.woff2)}
@font-face{font-family:K;font-weight:800;src:url(kufi800.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:P,K;background:radial-gradient(ellipse at 50% 40%,#fff 0%,#f6f4ef 70%,#efebe2 100%)}
.ln{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#d9a521,transparent);opacity:.7}
.el{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;opacity:0}
#logo img{height:96px}
#band span{background:#d9a521;color:#1c2a4a;font-weight:800;font-size:58px;padding:8px 40px 12px;border-radius:12px;letter-spacing:1px;display:inline-block}
#head{font-weight:800;color:#1c2a4a;font-size:138px;letter-spacing:1px;line-height:1}
#idr{gap:22px;font-weight:700;font-size:60px;color:#1c2a4a}
.yt{width:104px;height:74px;border-radius:20px;background:#ff0000;position:relative;display:inline-block}
.yt:after{content:'';position:absolute;left:41px;top:20px;border-left:30px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent}
#btn span{background:#e00;color:#fff;font-weight:800;font-size:62px;padding:18px 64px 22px;border-radius:60px;box-shadow:0 14px 30px rgba(204,0,0,.35);display:inline-flex;align-items:center;gap:22px}
#foot{font-weight:700;font-size:34px;color:#2e6b4a}
#cur{position:absolute;width:64px;opacity:0}
#rip{position:absolute;border-radius:50%;border:6px solid rgba(255,255,255,.9);opacity:0}
#slog{font-weight:800;font-size:84px;color:#1c2a4a}#slog b{background:#d9a521;padding:2px 24px 8px;border-radius:12px}
#chips{gap:20px}.c{display:flex;align-items:center;background:#fff;border:5px solid #d9a521;border-radius:50px;padding:10px 28px;font-weight:800;font-size:44px;color:#1c2a4a}
.ar{font-family:K}
</style></head><body>
<div class=ln style="top:96px"></div><div class=ln style="bottom:96px"></div>
<div id=logo class=el style="top:140px"><img src="logo.png"></div>
<div id=band class=el style="top:280px"><span>4 DİLDE İSG EĞİTİMLERİ</span></div>
<div id=head class=el style="top:395px">YOUTUBE'DA İZLE!</div>
<div id=idr class=el style="top:585px"><i class=yt></i>@isingundemi</div>
<div id=btn class=el style="top:710px"><span>ABONE OL</span></div>
<div id=foot class=el style="top:900px">🔊 Seslendirme + 💬 Altyazı Desteği</div>
<div id=slog class=el style="top:300px">Doğru bilgi,&nbsp;<b>güvenli yaşam.</b></div>
<div id=chips class=el style="top:470px"><div class=c>Türkçe</div><div class=c>Kurmancî</div><div class="c"><span class=ar>العربية</span></div><div class=c>English</div></div>
<svg id=cur viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2 3.8 7-3 1.6-3.8-7L4 20z" fill="#1c2a4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div id=rip></div>
<script>
const MODE=new URLSearchParams(location.search).get('m')||'h';
const ease=p=>1-Math.pow(1-Math.max(0,Math.min(1,p)),3);
const $=id=>document.getElementById(id);
const show=(id,a,dur=0.4,dy=24)=>(t)=>{const p=ease((t-a)/dur);$(id).style.opacity=p;$(id).style.transform=`translateY(${dy*(1-p)}px) scale(${.96+.04*p})`;};
let plan=[];
if(MODE=='h'){plan=[show('logo',0.15),show('band',0.6),show('head',1.0,0.45,30),show('idr',1.9),show('btn',2.9),show('foot',3.4)];}
if(MODE=='yt'){$('logo').style.top='150px';$('slog').style.top='300px';$('chips').style.top='450px';
 plan=[show('logo',0.15),show('slog',0.6),show('chips',1.2)];}
if(MODE=='v'){$('logo').style.top='150px';$('slog').style.top='320px';$('chips').style.top='490px';$('idr').style.top='660px';$('slog').style.fontSize='76px';
 plan=[show('logo',0.15),show('slog',0.6),show('chips',1.2),show('idr',1.8)];}
window.seek=(t)=>{plan.forEach(f=>f(t));
 if(MODE=='h'){const b=$('btn').querySelector('span');let s=1;
  if(t>3.9&&t<4.5)s=1+0.04*Math.sin((t-3.9)/0.6*Math.PI);
  const c=$('cur'),r=b.getBoundingClientRect();const tx=r.left+r.width*0.62,ty=r.top+r.height*0.55;
  const p=ease((t-4.5)/0.6);c.style.opacity=Math.min(1,Math.max(0,(t-4.5)/0.2))*(t<7.4?1:0);
  c.style.left=(tx+260*(1-p))+'px';c.style.top=(ty+180*(1-p))+'px';
  if(t>5.15&&t<5.35){s*=0.95;b.style.background='#b00';}else b.style.background='#e00';
  b.style.transform=`scale(${s})`;
  const rp=$('rip');if(t>5.15&&t<5.8){const q=(t-5.15)/0.65;const R=40+160*q;rp.style.opacity=1-q;rp.style.width=rp.style.height=2*R+'px';rp.style.left=(tx-R)+'px';rp.style.top=(ty-R)+'px';}else rp.style.opacity=0;}
};
</script></body></html>
