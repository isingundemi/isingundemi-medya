<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(poppins-latin-ext-500-normal.woff2),url(poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(poppins-latin-ext-600-normal.woff2),url(poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(poppins-latin-ext-700-normal.woff2),url(poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(poppins-latin-ext-800-normal.woff2),url(poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:500;unicode-range:U+0000-00FF;src:url(poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;unicode-range:U+0000-00FF;src:url(poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;unicode-range:U+0000-00FF;src:url(poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;unicode-range:U+0000-00FF;src:url(poppins-latin-800-normal.woff2)}
:root{--navy:#1c2a4a;--gold:#d9a521;--goldd:#b8861a;--green:#2e6b4a;--red:#c8321e}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#fff;font-family:P,sans-serif;position:relative}
.foto{position:absolute;right:0;top:0;width:700px;height:720px;background:url(karakter_kirp.jpg) 28% 22%/cover no-repeat}
.foto:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.92) 9%,rgba(255,255,255,.35) 22%,rgba(255,255,255,0) 34%)}
.logo{position:absolute;left:56px;top:50px;height:60px}
.tag{position:absolute;left:56px;top:136px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:17px;color:var(--navy)}
.tag i{display:block;width:58px;height:3px;background:var(--gold)}
.ust{position:absolute;left:56px;top:186px;font-weight:600;font-size:22px;letter-spacing:3px;color:var(--red)}
.h1{position:absolute;left:52px;top:214px;font-weight:800;font-size:84px;line-height:1;color:var(--navy);letter-spacing:-1px}
.band{position:absolute;left:56px;top:314px;background:var(--gold);padding:10px 26px 6px;font-weight:800;font-size:54px;line-height:1.1;color:var(--navy)}
.alt{position:absolute;left:56px;top:412px;font-weight:700;font-size:28px;color:var(--green)}
.alt b{color:var(--gold);font-weight:800}
.dil{position:absolute;right:30px;top:28px;background:#fff;border:3px solid var(--gold);border-radius:16px;padding:8px 18px 8px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dil svg{width:34px;height:34px}
.dil .k{font-weight:800;font-size:32px;color:var(--navy);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.dil .k i{display:block;width:4px;height:30px;background:var(--gold);border-radius:2px}
.dil .s{font-weight:600;font-size:12px;color:#5a6278;letter-spacing:.5px;margin-top:-2px}
.imza{position:absolute;left:56px;bottom:52px}
.imza i{display:block;width:240px;height:3px;background:var(--gold);margin-bottom:14px}
.imza b{display:block;font-weight:700;font-size:23px;color:var(--navy)}
.imza span{font-weight:500;font-size:16px;color:#4a5068}
.sure{position:absolute;left:56px;top:470px;display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-weight:700;font-size:17px;padding:7px 16px;border-radius:30px}
.sure em{font-style:normal;color:var(--gold)}
</style></head><body>
<div class="foto"></div>
<img class="logo" src="logo.png">
<div class="tag"><i></i>__TAG__<i></i></div>
<div class="ust">__UST__</div>
<div class="h1">__H1__</div>
<div class="band">__BAND__</div>
<div class="alt">__ALT__</div>
<div class="sure">__SURE__</div>
<div class="dil">
 <svg viewBox="0 0 24 24" fill="none" stroke="#1c2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="#d9a521" stroke="#1c2a4a"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
 <div><div class="k">TR<i></i>EN</div><div class="s">__DILS__</div></div>
</div>
<div class="imza"><i></i><b>Alpay Oktay</b><span>__UNVAN__</span></div>
</body></html>
